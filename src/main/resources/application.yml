spring:
  application:
    name: arc-agent-openldap
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${ARC_AGENT_CONSUMER_GROUP:arc-agent-openldap}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

arc:
  agent:
    target-system: ${TARGET_SYSTEM:ldap://LDAP01}
    dry-run: ${ARC_AGENT_DRY_RUN:true}
    topics:
      identity: ${ARC_TOPICS_PROVISIONING_IDENTITY:arc.provisioning.identity}
      assignment: ${ARC_TOPICS_PROVISIONING_ASSIGNMENT:arc.provisioning.assignment}
      entitlement: ${ARC_TOPICS_PROVISIONING_ENTITLEMENT:arc.provisioning.entitlement}
    ldap:
      url: ${ARC_AGENT_LDAP_URL:ldap://localhost:10389}
      base-dn: ${ARC_AGENT_LDAP_BASE_DN:dc=example,dc=com}
      bind-dn: ${ARC_AGENT_LDAP_BIND_DN:}
      bind-password: ${ARC_AGENT_LDAP_BIND_PASSWORD:}
      users-ou: ${ARC_AGENT_LDAP_USERS_OU:ou=Users}
      # Type de compte -> branche (relative a base-dn). Les managers n'envoient que le type.
      account-type-ous:
        standard: ${ARC_AGENT_LDAP_ACCOUNT_TYPE_STANDARD_OU:ou=Users}
        admin: ${ARC_AGENT_LDAP_ACCOUNT_TYPE_ADMIN_OU:ou=Admins}
        service-account: ${ARC_AGENT_LDAP_ACCOUNT_TYPE_SERVICE_ACCOUNT_OU:ou=Services}
      groups-ou: ${ARC_AGENT_LDAP_GROUPS_OU:ou=Groups}
      group-placeholder-member: ${ARC_AGENT_LDAP_GROUP_PLACEHOLDER_MEMBER:}
    collection:
      enabled: ${ARC_AGENT_COLLECTION_ENABLED:false}
      topic: ${ARC_TOPICS_RAW_LDAP:iam.raw.ldap}
      cursor-topic: ${ARC_TOPICS_RAW_LDAP_CURSOR:iam.raw.ldap.cursor}
      filter: ${ARC_AGENT_COLLECTION_FILTER:(|(objectClass=inetOrgPerson)(objectClass=groupOfNames))}
      retry-delay: ${ARC_AGENT_COLLECTION_RETRY_DELAY:10s}
      own-write-ttl: ${ARC_AGENT_COLLECTION_OWN_WRITE_TTL:30s}
      timeout: ${ARC_AGENT_COLLECTION_TIMEOUT:30s}

logging:
  level:
    com.instantaccessprovider.arcagentopenldap: INFO
